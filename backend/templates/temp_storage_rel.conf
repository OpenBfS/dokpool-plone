<zodb_db temporary>
    mount-point /temp_folder
    cache-size 100000
    %import relstorage
    <relstorage>
        # blob settings
        shared-blob-dir false
        blob-dir $INSTANCE/var/blobs-sessions
        # relstorage general settings
        keep-history false
        read-only false
        create-schema true
        blob-cache-size 6312427520
        # driver specific settings
        <postgresql>
            dsn $(SESSION_STORAGE_DSN)
        </postgresql>
    </relstorage>
</zodb_db>
