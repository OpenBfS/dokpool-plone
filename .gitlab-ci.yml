# Official Python Image
image: python:3.13.3-bullseye

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache"
  UV_CACHE_DIR: "$HOME/.cache/uv"
  PLONE_VERSION: "6.1.1"

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - ${PIP_CACHE_DIR}
    - ${UV_CACHE_DIR}

# Set execution order: first run jobs on 'test' stage on parallel
# then run jobs on 'report' stage
stages:
  - test
  - build
  - report
  - deploy

lint_tests:
  image: plone/server-builder:$PLONE_VERSION
  tags:
    - dind
  stage: test
  script:
    - cd backend
    - pip install --upgrade pip
    - pip install uv
    # lint test
    - make lint
    - make format

unit_tests:
  image: plone/server-builder:$PLONE_VERSION
  tags:
    - dind
  stage: test
  script:
    - apt update
    # LDAP client dependencies
    - apt-get install -y --no-install-recommends libsasl2-dev libldap2-dev libssl-dev curl
    # build
    - cd backend

    - export VIRTUAL_ENV=$(pwd)
    - pip install --upgrade pip
    - pip install uv
    - make install
    - make coverage
    # Download previous coverage
    - PREVIOUSCOVERAGE=$(curl -s https://static.steffen-lindner.de/coverage_ui.txt)
    - echo $PREVIOUSCOVERAGE
    # Save current coverage
    - uv run coverage report --precision=3 | grep TOTAL | awk '{print $NF}' | tr -d '%' > coverage_ui.txt
    - CURRENTCOVERAGE=$(cat coverage_ui.txt)
    - echo $CURRENTCOVERAGE
    - python scripts/check_coverage.py $PREVIOUSCOVERAGE $CURRENTCOVERAGE
    # Upload coverage
    - curl -sS --ftp-ssl --ftp-pasv --insecure --user lindner-bfs:$FTP_PASSWORD -T ./coverage_ui.txt ftp://mehl.schokokeks.org/coverage_ui.txt
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    paths:
      - backend/htmlcov/

acceptance_tests:
  image: git.starzel.de:5050/bfs/dokpool:acceptance
  tags:
    - dind
  stage: test
  script:
    - cd backend
    - pip install --upgrade pip
    - pip install uv
    - npm ci
    - make build-ui
    - make install-acceptance
    - make test-acceptance
  artifacts:
    paths:
      - screenshots/

build_image:
  tags:
    - shell
  stage: build
  script:
    # build docker
    # https://stackoverflow.com/questions/76654491/invalid-tag-missing-manifest-digest-when-exporting-nx-docker-image-to-gitlab-do
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - cd backend
    # On the shell-runner we only have 3.7 and don't need anything newer for now.
    - sed -i'' -e 's/PYTHON_VERSION_MIN=3\.11/PYTHON_VERSION_MIN=3.7/g' Makefile
    - make build-image-ci
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$NIGHTLY_UPDATE == "True"'

deploy_review:
  tags:
    - shell
  stage: deploy
  script:
    - curl --data-urlencode "" https://rundeck.portknox.info/api/16/job/18b65c46-4159-43ea-9989-7dc433fbccb0/run?authtoken=$authtoken
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$NIGHTLY_UPDATE == "True"'
